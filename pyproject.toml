[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdelta"
version = "0.1.0"
description = "Bounded, real filesystem edit-to-output qualification"
requires-python = ">=3.13"
dependencies = [
  "watchfiles==1.2.0",
  "markdown-it-py==4.2.0",
  "uvicorn==0.48.0",
  "hypercorn==0.18.0",
]

[project.optional-dependencies]
synthesis = [
  "numpy==2.3.5",
  "scipy==1.17.0",
]
dev = [
  "pytest==9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
